name: Python


on:
  push:
    branches: [main]
    paths:
      - '**/*.{rs,pyi}'
      - tests/**
      - pyproject.toml
      - uv.lock
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/python.yml
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
    paths:
      - '**/*.{rs,pyi}'
      - tests/**
      - pyproject.toml
      - uv.lock
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/python.yml

permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    name: >-
      wheels (${{ matrix.python.feature }},
      ${{ matrix.platform.runner }},
      ${{ matrix.platform.manylinux || 'manylinux'}}
      ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: '3.10'
            feature: pyo3/abi3-py310
          - version: '3.15t'
            feature: pyo3/abi3t-py315
        platform:
          - runner: windows-latest
            target: x64
            py-arch: x64
          - runner: windows-latest
            target: x86
            py-arch: x86
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: x86
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
        include:
          # insert these manually until python 3.11 is the minimum supported python version
          - python:
              version: '3.11'
              feature: pyo3/abi3-py311
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
          - python:
              version: '3.15t'
              feature: pyo3/abi3t-py315
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.py-arch || null }}
          # remove when python 3.15 goes stable
          allow-prereleases: ${{ startsWith(matrix.python.version, '3.15') }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.python.version }}
            --features ${{ matrix.python.feature }}
          # zizmor: ignore[cache-poisoning]
          sccache: ${{ startsWith(github.ref, 'refs/tags') && 'false' || 'true' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || '_' }}
          path: dist/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist/*

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout this Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        with:
          enable-cache: false
      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5 # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cargo
          key: python-test-${{ hashFiles('Cargo.lock', 'uv.lock') }}
      - name: Setup Rust
        run: rustup update --no-self-update
      - name: Install Workflow Dependencies
        run: uv sync
      - name: Run pytest
        run: uv run pytest -v --log-cli-level DEBUG --color yes

  release:
    runs-on: ubuntu-latest
    needs: [wheels, sdist, test]
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: twine Check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pipx run twine check dist/*

      - name: Publish package PyPI
        # uses trusted publishing
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
