name: Bump-n-Release

# NOTE: The change log is only updated in the remote upon release (in `bump-release` job)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: The version component to increment
        type: choice
        required: false
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:
  bump-release:
    environment:
      name: prep-deploy
    # permissions required for BUMP_N_RELEASE token:
    #   # for creating GitHub Release and pushing changes to metadata files
    #   contents: write
    #   # for generating CHANGELOG entries using PR history
    #   pull-requests: read
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BUMP_N_RELEASE }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Setup nushell
        uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97 # v3.25
        with:
          version: ${{ vars.NUSHELL_VERSION || '*' }}

      - run: >-
          cargo install cargo-edit
          --locked
          --no-default-features
          --features set-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Bump ${{ inputs.component }} version
        env:
          GITHUB_TOKEN: ${{ secrets.BUMP_N_RELEASE }}
          GITHUB_REPO: ${{ github.repository }}
          GIT_CLIFF_CONFIG: .config/cliff.toml
          UV_CONSTRAINTS: .github/requirements.txt
        run: nu .github/workflows/bump-n-release.nu ${{ inputs.component }}

  unreleased-notes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Generate release notes
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CLIFF_CONFIG: .config/cliff.toml
          UV_CONSTRAINTS: .github/requirements.txt
        run: >-
          uvx git-cliff
          --unreleased
          --strip all
          --bump
          --output "${GITHUB_STEP_SUMMARY}"
